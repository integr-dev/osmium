services:
  postgres:
    image: postgres:18-alpine
    container_name: osmium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: osmium
      POSTGRES_USER: osmium
      POSTGRES_PASSWORD: osmium
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osmium -d osmium"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
