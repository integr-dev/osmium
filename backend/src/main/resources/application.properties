spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/osmium
spring.datasource.username=osmium
spring.datasource.password=osmium

# Flyway owns the schema; Hibernate only checks that it matches the entities, and refuses to start
# if it does not. This replaced ddl-auto=update, which cost three separate debugging sessions: it
# never alters a CHECK constraint when an enum gains a value; it cannot add a not-null column to a
# table that already has rows, and logs that failure and starts anyway, so the symptom arrives much
# later as a query against a column that is not there; and it never drops what it has orphaned.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Adopts a database that predates Flyway: a non-empty schema is stamped at V1 rather than having it
# re-run, so existing tables are left alone and V2 onwards apply normally. Harmless on a fresh
# database, which is empty and therefore runs V1 like any other migration.
spring.flyway.baseline-on-migrate=true

# The scheduler runs five jobs, and the default pool of one thread makes them queue behind each
# other. The telemetry tick fires every second and the retention purges are bulk deletes that can
# take a while, so on one thread a purge would visibly stall live vitals once a night.
spring.task.scheduling.pool.size=4

# Both supported deployments put nginx in front of this, so getRemoteAddr() is the proxy rather than
# the operator - which would label every session with the same useless address. `native` installs
# Tomcat's RemoteIpValve, which rewrites the address from X-Forwarded-For **only when the peer is
# itself a private address**, so a client on the internet forging that header is ignored because the
# connection did not come from a proxy. It also fixes the address the host socket records on connect.
server.forward-headers-strategy=native

# Development signing key. MUST be overridden in production via OSMIUM_JWT_SECRET.
# HS256 requires at least 32 bytes.
osmium.jwt.secret=osmium-development-signing-key-change-me-before-deploying

# The access token's life, which is the interval between silent refreshes rather than anything an
# operator sees. It is held in the tab's memory only, so it never survives a reload.
osmium.jwt.ttl=30m

# How long a session lasts before the password is needed again, counted from the LOGIN and not from
# last activity: refreshing does not extend it. Twelve hours is a shift, so an operator signs in
# once a day whether or not they have been busy.
osmium.jwt.refresh-ttl=12h

# Off for development, like the signing key above, and MUST be left at its default of true anywhere
# real - set OSMIUM_JWT_COOKIE_SECURE=true, or simply do not override it.
#
# A Secure cookie is refused by the browser over plain HTTP unless the origin is localhost or
# 127.0.0.1, and Safari refuses it even there. So opening the dev server through a LAN address, a
# machine hostname or Safari silently drops the refresh cookie: the Set-Cookie header arrives, the
# browser discards it, and the session lasts exactly as long as the access token. Nothing reports
# that, which is what makes it worth defaulting off here rather than debugging it again.
osmium.jwt.cookie-secure=false

# Seeded only while the users table is empty, as a full administrator. Nothing forces a rotation,
# so set OSMIUM_BOOTSTRAP_USERNAME / OSMIUM_BOOTSTRAP_PASSWORD before the first boot anywhere
# that is not local development.
osmium.bootstrap.username=admin
osmium.bootstrap.password=admin

# Minecraft player heads are proxied through /api/avatars rather than fetched by the browser, so the
# frontend's img-src stays 'self' and no operator's browser talks to the skin service. Blank turns
# heads off entirely, and the interface falls back to initials - set OSMIUM_AVATAR_UPSTREAM= for an
# air-gapped deployment.
osmium.avatar.upstream=https://minotar.net/avatar/{id}/{size}.png
osmium.avatar.size=64
osmium.avatar.ttl=12h

# Empty, which leaves CORS off: both supported deployments proxy /api and are therefore same-origin.
# Set OSMIUM_CORS_ORIGINS to a comma-separated list of exact origins for a split-origin deployment.
osmium.cors.origins=

# Which Minecraft versions a schematic may have been saved from, as a data-version range. Both
# formats record one, and it is the only thing in a file that says which game its block names
# belong to.
#
# 1519 is Java Edition 1.13, the flattening: below it a file does not name its blocks at all, so
# there is nothing to read. 4903 is 26.2, the version the fleet plays on - a schematic from a
# NEWER Minecraft names blocks that do not exist yet, which is the end that actually bites.
#
# The range buys parseability, not compatibility. Most blocks are unchanged between versions, but
# some were renamed - grass became short_grass in 1.20.3 - and Osmium stores block names as
# strings without resolving them, so it cannot tell. That failure lands on the host at build time.
# Narrow this to a single version to refuse anything but the fleet's own.
osmium.schematic.min-data-version=1519
osmium.schematic.max-data-version=4903

springdoc.swagger-ui.path=/swagger-ui.html
