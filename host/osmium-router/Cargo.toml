[package]
name = "osmium-router"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
azalea-auth = "0.16.0"
azalea-client = "0.16.0"
futures = "0.3.34"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["alloc", "derive"] }
tokio = { workspace = true, features = ["net", "sync", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls", "rustls-native-certs", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "tokio-rustls"] }
uuid = { version = "1.24.0", features = ["v4", "rng"] }
osmium-agent = { version = "0.1.0", path = "../osmium-agent" }
