name: Host tests

on:
  pull_request:
    paths:
      - 'host/**'
      - '.github/workflows/host-tests.yml'
      - '.github/scripts/junit-summary.mjs'
  workflow_dispatch:
  # Called by host-image.yml, which gates publishing on this. There is deliberately no `push`
  # trigger: on main the image workflow drives this, so the suite runs once rather than twice.
  workflow_call:

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    defaults:
      run:
        working-directory: host

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: host/package-lock.json

      - run: npm ci

      # Both checks run even after the first fails, so one run reports every problem rather than
      # hiding a type error behind a failing test. Any failure still fails the job.
      - name: Unit tests
        run: npm run test:ci

      # `build` is `tsc`, which type-checks as it emits, so this is the type check as well.
      - name: Type-check and build
        if: always()
        run: npm run build

      - name: Summarise test results
        if: always()
        run: node "$GITHUB_WORKSPACE/.github/scripts/junit-summary.mjs" "Host unit tests" test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-results
          path: host/test-results
          if-no-files-found: warn
          retention-days: 14
