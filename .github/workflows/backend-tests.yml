name: Backend tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
      - '.github/scripts/junit-summary.mjs'
  workflow_dispatch:
  # Called by backend-image.yml, which gates publishing on this. There is deliberately no `push`
  # trigger: on main the image workflow drives this, so the suite runs once rather than twice.
  workflow_call:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Testcontainers starts a real Postgres 18, so this needs the Docker daemon the hosted Ubuntu
    # runner provides. It will not work on a container-based or self-hosted runner without one.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew test

      - name: Summarise test results
        if: always()
        run: node "$GITHUB_WORKSPACE/.github/scripts/junit-summary.mjs" "Backend tests" build/test-results/test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/build/test-results/test
            backend/build/reports/tests/test
          if-no-files-found: warn
          retention-days: 14
