name: Backend image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

# A native-image build runs for tens of minutes; drop superseded runs rather than queue them.
concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from build.gradle.kts
        id: version
        run: |
          version=$(grep -oP '^version\s*=\s*"\K[^"]+' backend/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error file=backend/build.gradle.kts::could not read the project version"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -qE '^[a-zA-Z0-9_][a-zA-Z0-9._-]*$'; then
            echo "::error file=backend/build.gradle.kts::version '$version' is not a valid docker tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
